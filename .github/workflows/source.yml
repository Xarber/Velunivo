name: Refresh AltSource
on:
  workflow_run:
    workflows: ['Build and release']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing binary release, e.g. v0.1.0'
        required: true
permissions:
  contents: write
  actions: read
concurrency:
  group: altsource
  cancel-in-progress: false
jobs:
  source:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.release_tag }}
      SOURCE_RUN: ${{ github.event.workflow_run.id }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          if [[ -z "$TAG" ]]; then
            mkdir -p work/notes
            gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --name notes --dir work/notes
            TAG=$(head -1 work/notes/release-notes.md | sed 's/^# //')
          fi
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          newest=$(gh release list --exclude-drafts --limit 100 --json tagName --jq '.[].tagName' | python3 -c 'import sys,re; tags=[s.strip() for s in sys.stdin if re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+",s.strip())]; print(max(tags,key=lambda t:tuple(map(int,t[1:].split(".")))))')
          if [[ "$TAG" != "$newest" ]]; then
            echo '::notice::A newer binary release exists; preserve its AltSource metadata.'
            exit 0
          fi
          mkdir -p artifacts work/source
          if gh release view "$TAG" --json assets --jq '.assets[].name' | grep -qx build_info.json; then
            gh release download "$TAG" --pattern build_info.json --dir artifacts
            python3 -c 'import json,pathlib; p=pathlib.Path("artifacts"); info=json.loads((p/"build_info.json").read_text()); (p/"ios-metadata.json").write_text(json.dumps(info["ios"])); (p/"release-notes.md").write_text(info.get("details",{}).get("release-notes.md",""))'
          else
            gh release download "$TAG" --pattern ios-metadata.json --dir artifacts
          fi
          gh release download 1.0 --pattern apps.json --dir work/source
          python3 scripts/update-source.py --repo "$GITHUB_REPOSITORY" --tag "$TAG" --existing work/source/apps.json --output work/source/apps.json
          python3 scripts/publish-source.py --repo "$GITHUB_REPOSITORY" --source work/source
