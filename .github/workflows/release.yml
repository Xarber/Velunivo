name: Build and release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'App version, e.g. 0.1.0 (the 1.0 tag is reserved for the source feed)'
        required: true
        default: '0.1.11'
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  prepare:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="${INPUT_VERSION:-${GITHUB_REF_NAME#v}}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Use major.minor.patch'; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint && npm run typecheck && npm test
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Pin the unsigned release tag before compilation
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: bash scripts/pin-release-tag.sh
      - run: node scripts/release-notes.mjs
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
      - uses: actions/upload-artifact@v4
        with:
          name: notes
          path: release-notes.md
  web:
    needs: prepare
    runs-on: ubuntu-latest
    env:
      APP_VERSION: ${{ needs.prepare.outputs.version }}
      BUILD_NUMBER: ${{ github.run_number }}
      EXPO_PUBLIC_ROUTING_URL: ${{ vars.ROUTING_URL }}
      EXPO_PUBLIC_MAP_STYLE_URL: ${{ vars.MAP_STYLE_URL }}
      EXPO_PUBLIC_ALLOW_OFFLINE_DOWNLOADS: ${{ vars.ALLOW_OFFLINE_DOWNLOADS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx expo export --platform web --output-dir dist
      - run: cd dist && zip -qr ../web.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: web.zip
  android:
    needs: prepare
    runs-on: ubuntu-latest
    env:
      APP_VERSION: ${{ needs.prepare.outputs.version }}
      BUILD_NUMBER: ${{ github.run_number }}
      EXPO_PUBLIC_ROUTING_URL: ${{ vars.ROUTING_URL }}
      EXPO_PUBLIC_MAP_STYLE_URL: ${{ vars.MAP_STYLE_URL }}
      EXPO_PUBLIC_ALLOW_OFFLINE_DOWNLOADS: ${{ vars.ALLOW_OFFLINE_DOWNLOADS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Select latest stable Android Studio SDK
        run: |
          sdkmanager --list --channel=0 > /tmp/sdk-list.txt
          api=$(sed -nE 's/^[[:space:]]*platforms;android-([0-9]+)[[:space:]]*\|.*/\1/p' /tmp/sdk-list.txt | sort -nu | tail -1)
          tools=$(sed -nE 's/^[[:space:]]*build-tools;([0-9]+\.[0-9]+\.[0-9]+)[[:space:]]*\|.*/\1/p' /tmp/sdk-list.txt | sort -Vu | tail -1)
          test -n "$api" && test -n "$tools"
          sdkmanager "platforms;android-$api" "build-tools;$tools" "platform-tools"
          echo "ANDROID_COMPILE_SDK=$api" >> "$GITHUB_ENV"
          echo "ANDROID_BUILD_TOOLS=$tools" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npx expo prebuild --platform android --no-install
      - name: Restore Gradle dependency and build caches
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Optional stable Android signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/app/velunivo.keystore
            python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/build.gradle');s=p.read_text();marker='signingConfigs {'
          config='''signingConfigs {
                  velunivo {
                      storeFile file("velunivo.keystore")
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
          '''
          if marker not in s: raise SystemExit('Signing config layout changed')
          s=s.replace(marker,config,1)
          s=s.replace('signingConfig signingConfigs.debug','signingConfig signingConfigs.velunivo')
          p.write_text(s)
          PY
          fi
      - name: Build APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew assembleRelease --build-cache --no-daemon --max-workers=2
      - run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/release/app-release.apk artifacts/Velunivo.apk
          "$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS/apksigner" verify artifacts/Velunivo.apk
          printf 'Android API %s; build-tools %s\n' "$ANDROID_COMPILE_SDK" "$ANDROID_BUILD_TOOLS" > artifacts/android-build.txt
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: artifacts/*
  ios:
    needs: prepare
    runs-on: xcode-27
    env:
      CCACHE_DIR: ${{ github.workspace }}/.velunivo-ccache
      CCACHE_MAXSIZE: 1G
      CCACHE_COMPILERCHECK: content
      CCACHE_BASEDIR: ${{ github.workspace }}
      APP_VERSION: ${{ needs.prepare.outputs.version }}
      BUILD_NUMBER: ${{ github.run_number }}
      EXPO_PUBLIC_ROUTING_URL: ${{ vars.ROUTING_URL }}
      EXPO_PUBLIC_MAP_STYLE_URL: ${{ vars.MAP_STYLE_URL }}
      EXPO_PUBLIC_ALLOW_OFFLINE_DOWNLOADS: ${{ vars.ALLOW_OFFLINE_DOWNLOADS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Select newest installed Xcode beta (never silently use stable)
        run: |
          python3 - <<'PY' >> "$GITHUB_ENV"
          from pathlib import Path
          import re
          candidates=[p for p in Path('/Applications').glob('Xcode*.app') if 'beta' in p.name.lower() and not p.is_symlink()]
          if not candidates: raise SystemExit('No Xcode beta installed on this runner')
          chosen=max(candidates,key=lambda p:tuple(map(int,re.findall(r'\d+',p.name))))
          print(f'DEVELOPER_DIR={chosen}/Contents/Developer')
          print(f'XCODE_CACHE_ID={chosen.name}')
          PY
      - name: Restore iOS C++ compiler cache
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ios-ccache-${{ runner.arch }}-${{ env.XCODE_CACHE_ID }}-${{ github.sha }}
          restore-keys: ios-ccache-${{ runner.arch }}-${{ env.XCODE_CACHE_ID }}-
      - name: Enable C++ cache when available on the runner
        run: |
          if ! command -v ccache >/dev/null; then
            brew install ccache || true
          fi
          if command -v ccache >/dev/null; then
            echo 'VELUNIVO_CCACHE=1' >> "$GITHUB_ENV"
          else
            echo '::warning::ccache unavailable; continue with a normal native build.'
          fi
      - run: xcodebuild -version && xcodebuild -showsdks
      - run: npm ci
      - run: npx expo prebuild --platform ios --no-install
      - run: cd ios && pod install
      - name: Archive iPhone app without signing
        run: |
          mkdir -p artifacts
          xcodebuild -workspace ios/Velunivo.xcworkspace -scheme Velunivo -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -archivePath "$PWD/artifacts/Velunivo.xcarchive" archive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          mkdir -p artifacts/Payload
          cp -R artifacts/Velunivo.xcarchive/Products/Applications/Velunivo.app artifacts/Payload/
          (cd artifacts && zip -qry Velunivo.ipa Payload)
          python3 scripts/ios-metadata.py --app artifacts/Payload/Velunivo.app --ipa artifacts/Velunivo.ipa
          xcodebuild -version > artifacts/ios-build.txt
      - name: Upload unsigned iPhone IPA immediately
        uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-early
          path: artifacts/Velunivo.ipa
          if-no-files-found: error
          retention-days: 1
      - name: Build Apple Silicon Simulator app
        run: |
          xcodebuild -workspace ios/Velunivo.xcworkspace -scheme Velunivo -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath "$PWD/work/simulator" build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO ARCHS=arm64 ONLY_ACTIVE_ARCH=NO
          cp -R work/simulator/Build/Products/Release-iphonesimulator/Velunivo.app artifacts/Velunivo-simulator.app
          ditto -c -k --keepParent artifacts/Velunivo-simulator.app artifacts/Velunivo-simulator.app.zip
      - name: Report compiler cache statistics
        if: always()
        run: if command -v ccache >/dev/null; then ccache --show-stats; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios
          path: |
            artifacts/Velunivo.ipa
            artifacts/Velunivo-simulator.app.zip
            artifacts/ios-metadata.json
            artifacts/ios-build.txt
            artifacts/iphone.png
            artifacts/ipad.png
            artifacts/*-launch.log
            artifacts/*-simulator.log
            artifacts/*.ips
  verify-ios:
    continue-on-error: true
    needs: ios
    runs-on: xcode-27
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        family: [iphone, ipad]
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Select newest installed Xcode beta
        run: |
          python3 - <<'PYCODE' >> "$GITHUB_ENV"
          from pathlib import Path
          import re
          candidates=[p for p in Path('/Applications').glob('Xcode*.app') if 'beta' in p.name.lower() and not p.is_symlink()]
          if not candidates: raise SystemExit('No Xcode beta installed on this runner')
          chosen=max(candidates,key=lambda p:tuple(map(int,re.findall(r'\d+',p.name))))
          print(f'DEVELOPER_DIR={chosen}/Contents/Developer')
          PYCODE
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: ios
          path: artifacts
      - name: Unpack compiled Simulator app
        continue-on-error: true
        run: ditto -x -k artifacts/Velunivo-simulator.app.zip artifacts
      - name: Capture fresh Simulator screenshots (two bounded attempts)
        id: capture
        continue-on-error: true
        timeout-minutes: 8
        run: python3 scripts/simulator-screenshots.py --family "${{ matrix.family }}"
      - name: Reuse last published screenshot after capture failure
        if: steps.capture.outcome == 'failure'
        timeout-minutes: 3
        continue-on-error: true
        run: python3 scripts/screenshot-fallback.py --repo "$GITHUB_REPOSITORY" --family "${{ matrix.family }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-${{ matrix.family }}-verification
          path: |
            artifacts/${{ matrix.family }}.png
            artifacts/${{ matrix.family }}-screenshot.json
            artifacts/${{ matrix.family }}-host.log
            artifacts/${{ matrix.family }}-launch.log
            artifacts/${{ matrix.family }}-simulator.log
            artifacts/*.ips
  publish:
    if: ${{ always() && needs.prepare.result == 'success' && needs.web.result == 'success' && needs.android.result == 'success' && needs.ios.result == 'success' }}
    concurrency:
      group: altsource
      cancel-in-progress: false
    needs: [prepare, web, android, ios, verify-ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish binaries and conventional release notes
        run: |
          (cd artifacts && sha256sum Velunivo.ipa Velunivo.apk Velunivo-simulator.app.zip web.zip > SHA256SUMS)
          python3 scripts/screenshot-notes.py --assets artifacts --notes artifacts/release-notes.md
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --notes-file artifacts/release-notes.md
          else
            gh release create "$RELEASE_TAG" --verify-tag --title "Velunivo ${{ needs.prepare.outputs.version }}" --notes-file artifacts/release-notes.md
          fi
          gh release upload "$RELEASE_TAG" artifacts/* --clobber
      - name: Update mutable AltSource release at fixed 1.0 URL
        run: |
          if ! gh release view 1.0 >/dev/null 2>&1; then
            gh release create 1.0 --target "$GITHUB_SHA" --title 'Velunivo AltSource' --notes 'Mutable source feed. Add apps.json to AltStore Classic or SideStore. Binary releases use v-prefixed version tags.' --latest=false
          fi
          mkdir -p work/source
          gh release download 1.0 --pattern apps.json --dir work/source || true
          python3 scripts/update-source.py --repo "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG" --existing work/source/apps.json --output work/source/apps.json
          gh release upload 1.0 work/source/apps.json work/source/icon-*.png assets/icon.png docs/brand/banner.png docs/brand/social-preview.png --clobber
