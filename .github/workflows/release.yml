name: Build and release
on:
  push:
    branches: [main, testing]
  workflow_dispatch:
    inputs:
      version:
        description: 'App version, e.g. 1.0.0 (the 1.0 tag is reserved for the source feed)'
        required: true
        default: '2.7.2'
      development_build:
        description: 'Development client (Debug), artifacts only; choose any branch above'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: velunivo-release-${{ github.ref_name }}
  cancel-in-progress: true
env:
  APP_DEVELOPMENT_BUILD: ${{ inputs.development_build && '1' || '0' }}
  SKIP_BUNDLING: ${{ inputs.development_build && '1' || '' }}
  EXPO_PUBLIC_UPDATE_REPOSITORY: ${{ github.repository }}
  EXPO_PUBLIC_UI_REFINEMENTS: ${{ vars.VELUNIVO_UI_REFINEMENTS || '1' }}
jobs:
  prepare:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="${INPUT_VERSION:-$(node -p 'require("./package.json").version')}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Use major.minor.patch'; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$APP_DEVELOPMENT_BUILD" == '1' ]]; then
            echo "tag=dev-$version-$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
            echo 'prerelease=true' >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF_NAME" != 'main' ]]; then
            echo "tag=v$version-testing.$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
            echo 'prerelease=true' >> "$GITHUB_OUTPUT"
          else
            echo "tag=v$version" >> "$GITHUB_OUTPUT"
            echo 'prerelease=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Compute version-independent native dependency cache key
        run: python3 scripts/native-cache-key.py >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint && npm run typecheck && npm test
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Pin the unsigned release tag before compilation
        if: inputs.development_build != true
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: bash scripts/pin-release-tag.sh
      - run: node scripts/generate-developer-changelog.mjs
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
      - run: node scripts/release-notes.mjs
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
      - uses: actions/upload-artifact@v4
        with:
          name: notes
          path: |
            release-notes.md
            src/core/developerReleaseNotes.json
            src/core/buildIdentity.generated.json
  web:
    needs: prepare
    runs-on: ubuntu-latest
    env:
      WEB_PUBLIC_ORIGIN: ${{ vars.WEB_PUBLIC_ORIGIN }}
      APP_VERSION: ${{ needs.prepare.outputs.version }}
      EXPO_PUBLIC_OVERPASS_URL: ${{ vars.OVERPASS_URL }}
      EXPO_PUBLIC_APP_VERSION: ${{ needs.prepare.outputs.version }}
      EXPO_PUBLIC_COMMIT_SHA: ${{ github.sha }}
      BUILD_NUMBER: ${{ github.run_number }}
      EXPO_PUBLIC_ROUTING_URL: ${{ vars.ROUTING_URL }}
      EXPO_PUBLIC_MAP_STYLE_URL: ${{ vars.MAP_STYLE_URL }}
      EXPO_PUBLIC_ALLOW_OFFLINE_DOWNLOADS: ${{ vars.ALLOW_OFFLINE_DOWNLOADS }}
      EXPO_PUBLIC_SHARE_ORIGIN: ${{ vars.SHARE_ORIGIN }}
      EXPO_PUBLIC_PEER_HOST: ${{ vars.PEER_HOST }}
      EXPO_PUBLIC_PEER_PORT: ${{ vars.PEER_PORT }}
      EXPO_PUBLIC_PEER_PATH: ${{ vars.PEER_PATH }}
      EXPO_PUBLIC_PEER_SECURE: ${{ vars.PEER_SECURE }}
      EXPO_PUBLIC_PEER_ICE_SERVERS: ${{ vars.PEER_ICE_SERVERS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: notes
          path: .release-metadata
      - run: cp .release-metadata/src/core/{developerReleaseNotes.json,buildIdentity.generated.json} src/core/
      - name: Compute version-independent native dependency cache key
        run: python3 scripts/native-cache-key.py >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/generate-pwa.mjs
      - run: npx expo export --platform web --output-dir dist
      - run: node scripts/build-pwa.mjs dist
      - run: cd dist && zip -qr ../web.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: web.zip
  android:
    needs: prepare
    runs-on: ubuntu-latest
    env:
      CCACHE_DIR: ${{ github.workspace }}/.android-ccache
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPILERCHECK: content
      CCACHE_BASEDIR: ${{ github.workspace }}
      APP_VERSION: ${{ needs.prepare.outputs.version }}
      EXPO_PUBLIC_OVERPASS_URL: ${{ vars.OVERPASS_URL }}
      EXPO_PUBLIC_APP_VERSION: ${{ needs.prepare.outputs.version }}
      EXPO_PUBLIC_COMMIT_SHA: ${{ github.sha }}
      BUILD_NUMBER: ${{ github.run_number }}
      EXPO_PUBLIC_ROUTING_URL: ${{ vars.ROUTING_URL }}
      EXPO_PUBLIC_MAP_STYLE_URL: ${{ vars.MAP_STYLE_URL }}
      EXPO_PUBLIC_ALLOW_OFFLINE_DOWNLOADS: ${{ vars.ALLOW_OFFLINE_DOWNLOADS }}
      EXPO_PUBLIC_SHARE_ORIGIN: ${{ vars.SHARE_ORIGIN }}
      EXPO_PUBLIC_PEER_HOST: ${{ vars.PEER_HOST }}
      EXPO_PUBLIC_PEER_PORT: ${{ vars.PEER_PORT }}
      EXPO_PUBLIC_PEER_PATH: ${{ vars.PEER_PATH }}
      EXPO_PUBLIC_PEER_SECURE: ${{ vars.PEER_SECURE }}
      EXPO_PUBLIC_PEER_ICE_SERVERS: ${{ vars.PEER_ICE_SERVERS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: notes
          path: .release-metadata
      - run: cp .release-metadata/src/core/{developerReleaseNotes.json,buildIdentity.generated.json} src/core/
      - name: Compute version-independent native dependency cache key
        run: python3 scripts/native-cache-key.py >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Select latest stable Android Studio SDK
        run: |
          sdkmanager --list --channel=0 > /tmp/sdk-list.txt
          api=$(sed -nE 's/^[[:space:]]*platforms;android-([0-9]+)[[:space:]]*\|.*/\1/p' /tmp/sdk-list.txt | sort -nu | tail -1)
          tools=$(sed -nE 's/^[[:space:]]*build-tools;([0-9]+\.[0-9]+\.[0-9]+)[[:space:]]*\|.*/\1/p' /tmp/sdk-list.txt | sort -Vu | tail -1)
          test -n "$api" && test -n "$tools"
          sdkmanager "platforms;android-$api" "build-tools;$tools" "platform-tools"
          echo "ANDROID_COMPILE_SDK=$api" >> "$GITHUB_ENV"
          echo "ANDROID_BUILD_TOOLS=$tools" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npx expo prebuild --platform android --no-install
      - name: Restore Gradle dependency and build caches
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Restore Android native compiler cache
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: ${{ env.CCACHE_DIR }}
          key: android-native-${{ runner.arch }}-${{ env.ANDROID_COMPILE_SDK }}-${{ env.NATIVE_DEPENDENCY_KEY }}-${{ github.sha }}
          restore-keys: |
            android-native-${{ runner.arch }}-${{ env.ANDROID_COMPILE_SDK }}-${{ env.NATIVE_DEPENDENCY_KEY }}-
            android-native-${{ runner.arch }}-${{ env.ANDROID_COMPILE_SDK }}-
      - name: Enable native CMake compiler cache
        run: |
          if ! command -v ccache >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y ccache || true
          fi
          if command -v ccache >/dev/null; then
            echo 'CMAKE_C_COMPILER_LAUNCHER=ccache' >> "$GITHUB_ENV"
            echo 'CMAKE_CXX_COMPILER_LAUNCHER=ccache' >> "$GITHUB_ENV"
          else
            echo '::warning::ccache unavailable; continuing with normal Android compilation.'
          fi
      - name: Optional stable Android signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/app/velunivo.keystore
            python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/build.gradle');s=p.read_text();marker='signingConfigs {'
          config='''signingConfigs {
                  velunivo {
                      storeFile file("velunivo.keystore")
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
          '''
          if marker not in s: raise SystemExit('Signing config layout changed')
          s=s.replace(marker,config,1)
          s=s.replace('signingConfig signingConfigs.debug','signingConfig signingConfigs.velunivo')
          p.write_text(s)
          PY
          fi
      - name: Build APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew "$([[ "$APP_DEVELOPMENT_BUILD" == '1' ]] && echo assembleDebug || echo assembleRelease)" --build-cache --no-daemon --max-workers=2 -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError"
      - name: Report Android compiler cache statistics
        if: always()
        run: if command -v ccache >/dev/null; then ccache --show-stats; fi
      - run: |
          mkdir -p artifacts
          variant=release; [[ "$APP_DEVELOPMENT_BUILD" != '1' ]] || variant=debug
          cp "android/app/build/outputs/apk/$variant/app-$variant.apk" artifacts/Velunivo.apk
          "$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS/apksigner" verify artifacts/Velunivo.apk
          printf 'Android API %s; build-tools %s\n' "$ANDROID_COMPILE_SDK" "$ANDROID_BUILD_TOOLS" > artifacts/android-build.txt
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: artifacts/*
  ios:
    needs: prepare
    runs-on: xcode-27
    env:
      CCACHE_DIR: ${{ github.workspace }}/.velunivo-ccache
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPILERCHECK: content
      CCACHE_BASEDIR: ${{ github.workspace }}
      APP_VERSION: ${{ needs.prepare.outputs.version }}
      EXPO_PUBLIC_OVERPASS_URL: ${{ vars.OVERPASS_URL }}
      EXPO_PUBLIC_APP_VERSION: ${{ needs.prepare.outputs.version }}
      EXPO_PUBLIC_COMMIT_SHA: ${{ github.sha }}
      BUILD_NUMBER: ${{ github.run_number }}
      EXPO_PUBLIC_ROUTING_URL: ${{ vars.ROUTING_URL }}
      EXPO_PUBLIC_MAP_STYLE_URL: ${{ vars.MAP_STYLE_URL }}
      EXPO_PUBLIC_ALLOW_OFFLINE_DOWNLOADS: ${{ vars.ALLOW_OFFLINE_DOWNLOADS }}
      EXPO_PUBLIC_SHARE_ORIGIN: ${{ vars.SHARE_ORIGIN }}
      EXPO_PUBLIC_PEER_HOST: ${{ vars.PEER_HOST }}
      EXPO_PUBLIC_PEER_PORT: ${{ vars.PEER_PORT }}
      EXPO_PUBLIC_PEER_PATH: ${{ vars.PEER_PATH }}
      EXPO_PUBLIC_PEER_SECURE: ${{ vars.PEER_SECURE }}
      EXPO_PUBLIC_PEER_ICE_SERVERS: ${{ vars.PEER_ICE_SERVERS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: notes
          path: .release-metadata
      - run: cp .release-metadata/src/core/{developerReleaseNotes.json,buildIdentity.generated.json} src/core/
      - name: Compute version-independent native dependency cache key
        run: python3 scripts/native-cache-key.py >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Select newest installed prerelease Xcode (beta or RC)
        run: |
          python3 scripts/select-xcode.py >> "$GITHUB_ENV"
      - name: Restore incremental iPhone build products
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: .derived-ios
          key: ios-derived-${{ runner.arch }}-${{ env.XCODE_CACHE_ID }}-${{ env.NATIVE_DEPENDENCY_KEY }}-${{ github.sha }}
          restore-keys: |
            ios-derived-${{ runner.arch }}-${{ env.XCODE_CACHE_ID }}-${{ env.NATIVE_DEPENDENCY_KEY }}-
            ios-derived-${{ runner.arch }}-${{ env.XCODE_CACHE_ID }}-
      - name: Restore iOS C++ compiler cache
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ios-ccache-${{ runner.arch }}-${{ env.XCODE_CACHE_ID }}-${{ github.sha }}
          restore-keys: ios-ccache-${{ runner.arch }}-${{ env.XCODE_CACHE_ID }}-
      - name: Enable C++ cache when available on the runner
        run: |
          if ! command -v ccache >/dev/null; then
            brew install ccache || true
          fi
          if command -v ccache >/dev/null; then
            echo 'VELUNIVO_CCACHE=1' >> "$GITHUB_ENV"
          else
            echo '::warning::ccache unavailable; continue with a normal native build.'
          fi
      - run: xcodebuild -version && xcodebuild -showsdks
      - run: npm ci
      - run: npx expo prebuild --platform ios --no-install
      - name: Cache verified React Native downloads
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: ~/Library/Caches/ReactNative
          key: rn-download-${{ runner.arch }}-${{ env.NATIVE_DEPENDENCY_KEY }}-${{ github.run_id }}-${{ github.job }}
          restore-keys: rn-download-${{ runner.arch }}-${{ env.NATIVE_DEPENDENCY_KEY }}-
      - name: Configure bounded dependency download retries
        run: bash scripts/configure-ios-downloads.sh
      - name: Install iOS dependencies with retry
        timeout-minutes: 15
        run: |
          for attempt in 1 2; do
            if (cd ios && pod install); then exit 0; fi
            if [ "$attempt" -eq 2 ]; then exit 1; fi
            echo '::warning::Dependency installation failed; retrying once.'
            sleep 5
          done
      - name: Archive iPhone app without signing
        run: |
          mkdir -p artifacts
          xcodebuild -derivedDataPath "$PWD/.derived-ios" -workspace ios/Velunivo.xcworkspace -scheme Velunivo -configuration "$([[ "$APP_DEVELOPMENT_BUILD" == '1' ]] && echo Debug || echo Release)" -sdk iphoneos -destination 'generic/platform=iOS' -archivePath "$PWD/artifacts/Velunivo.xcarchive" archive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CCACHE_DIR="$CCACHE_DIR" CCACHE_MAXSIZE="$CCACHE_MAXSIZE" CCACHE_BASEDIR="$CCACHE_BASEDIR" CCACHE_COMPILERCHECK="$CCACHE_COMPILERCHECK"
          mkdir -p artifacts/Payload
          cp -R artifacts/Velunivo.xcarchive/Products/Applications/Velunivo.app artifacts/Payload/
          (cd artifacts && zip -qry Velunivo.ipa Payload)
          python3 scripts/ios-metadata.py --app artifacts/Payload/Velunivo.app --ipa artifacts/Velunivo.ipa
          xcodebuild -version > artifacts/ios-build.txt
      - name: Upload unsigned iPhone IPA immediately
        uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-early
          path: artifacts/Velunivo.ipa
          if-no-files-found: error
          retention-days: 1
      - name: Report compiler cache statistics
        if: always()
        run: if command -v ccache >/dev/null; then ccache --show-stats; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios
          path: |
            artifacts/Velunivo.ipa
            artifacts/Velunivo-simulator.app.zip
            artifacts/ios-metadata.json
            artifacts/ios-build.txt
            artifacts/iphone.png
            artifacts/ipad.png
            artifacts/*-launch.log
            artifacts/*-simulator.log
            artifacts/*.ips
  ios-simulator:
    needs: prepare
    runs-on: xcode-27
    env:
      EXPO_PUBLIC_CAPTURE_FIXTURES: '1'
      CCACHE_DIR: ${{ github.workspace }}/.velunivo-ccache
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPILERCHECK: content
      CCACHE_BASEDIR: ${{ github.workspace }}
      APP_VERSION: ${{ needs.prepare.outputs.version }}
      EXPO_PUBLIC_OVERPASS_URL: ${{ vars.OVERPASS_URL }}
      EXPO_PUBLIC_APP_VERSION: ${{ needs.prepare.outputs.version }}
      EXPO_PUBLIC_COMMIT_SHA: ${{ github.sha }}
      BUILD_NUMBER: ${{ github.run_number }}
      EXPO_PUBLIC_ROUTING_URL: ${{ vars.ROUTING_URL }}
      EXPO_PUBLIC_MAP_STYLE_URL: ${{ vars.MAP_STYLE_URL }}
      EXPO_PUBLIC_ALLOW_OFFLINE_DOWNLOADS: ${{ vars.ALLOW_OFFLINE_DOWNLOADS }}
      EXPO_PUBLIC_SHARE_ORIGIN: ${{ vars.SHARE_ORIGIN }}
      EXPO_PUBLIC_PEER_HOST: ${{ vars.PEER_HOST }}
      EXPO_PUBLIC_PEER_PORT: ${{ vars.PEER_PORT }}
      EXPO_PUBLIC_PEER_PATH: ${{ vars.PEER_PATH }}
      EXPO_PUBLIC_PEER_SECURE: ${{ vars.PEER_SECURE }}
      EXPO_PUBLIC_PEER_ICE_SERVERS: ${{ vars.PEER_ICE_SERVERS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: notes
          path: .release-metadata
      - run: cp .release-metadata/src/core/{developerReleaseNotes.json,buildIdentity.generated.json} src/core/
      - name: Compute version-independent native dependency cache key
        run: python3 scripts/native-cache-key.py >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Select newest installed prerelease Xcode (beta or RC)
        run: |
          python3 scripts/select-xcode.py >> "$GITHUB_ENV"
      - name: Restore incremental Simulator build products
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: work/simulator
          key: sim-derived-${{ runner.arch }}-${{ env.XCODE_CACHE_ID }}-${{ env.NATIVE_DEPENDENCY_KEY }}-${{ github.sha }}
          restore-keys: |
            sim-derived-${{ runner.arch }}-${{ env.XCODE_CACHE_ID }}-${{ env.NATIVE_DEPENDENCY_KEY }}-
            sim-derived-${{ runner.arch }}-${{ env.XCODE_CACHE_ID }}-
      - name: Restore iOS C++ compiler cache
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: ${{ env.CCACHE_DIR }}
          key: simulator-ccache-${{ runner.arch }}-${{ env.XCODE_CACHE_ID }}-${{ github.sha }}
          restore-keys: simulator-ccache-${{ runner.arch }}-${{ env.XCODE_CACHE_ID }}-
      - name: Enable C++ cache when available on the runner
        run: |
          if ! command -v ccache >/dev/null; then
            brew install ccache || true
          fi
          if command -v ccache >/dev/null; then
            echo 'VELUNIVO_CCACHE=1' >> "$GITHUB_ENV"
          else
            echo '::warning::ccache unavailable; continue with a normal native build.'
          fi
      - run: xcodebuild -version && xcodebuild -showsdks
      - run: npm ci
      - run: npx expo prebuild --platform ios --no-install
      - name: Cache verified React Native downloads
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: ~/Library/Caches/ReactNative
          key: rn-download-${{ runner.arch }}-${{ env.NATIVE_DEPENDENCY_KEY }}-${{ github.run_id }}-${{ github.job }}
          restore-keys: rn-download-${{ runner.arch }}-${{ env.NATIVE_DEPENDENCY_KEY }}-
      - name: Configure bounded dependency download retries
        run: bash scripts/configure-ios-downloads.sh
      - name: Install iOS dependencies with retry
        timeout-minutes: 15
        run: |
          for attempt in 1 2; do
            if (cd ios && pod install); then exit 0; fi
            if [ "$attempt" -eq 2 ]; then exit 1; fi
            echo '::warning::Dependency installation failed; retrying once.'
            sleep 5
          done
      - run: mkdir -p artifacts
      - name: Build Apple Silicon Simulator app
        run: |
          xcodebuild -workspace ios/Velunivo.xcworkspace -scheme Velunivo -configuration "$([[ "$APP_DEVELOPMENT_BUILD" == '1' ]] && echo Debug || echo Release)" -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath "$PWD/work/simulator" build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO ARCHS=arm64 ONLY_ACTIVE_ARCH=NO CCACHE_DIR="$CCACHE_DIR" CCACHE_MAXSIZE="$CCACHE_MAXSIZE" CCACHE_BASEDIR="$CCACHE_BASEDIR" CCACHE_COMPILERCHECK="$CCACHE_COMPILERCHECK"
          configuration=Release; [[ "$APP_DEVELOPMENT_BUILD" != '1' ]] || configuration=Debug
          cp -R "work/simulator/Build/Products/$configuration-iphonesimulator/Velunivo.app" artifacts/Velunivo-simulator.app
          ditto -c -k --keepParent artifacts/Velunivo-simulator.app artifacts/Velunivo-simulator.app.zip
      - name: Report compiler cache statistics
        if: always()
        run: if command -v ccache >/dev/null; then ccache --show-stats; fi
      - uses: actions/upload-artifact@v4
        with:
          name: ios-simulator
          path: artifacts/Velunivo-simulator.app.zip
          if-no-files-found: error
  publish:
    if: ${{ inputs.development_build != true && always() && needs.prepare.result == 'success' && needs.web.result == 'success' && needs.android.result == 'success' && needs.ios.result == 'success' && needs.ios-simulator.result == 'success' }}
    concurrency:
      group: altsource
      cancel-in-progress: false
    needs: [prepare, web, android, ios, ios-simulator]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish binaries and conventional release notes
        run: |
          python3 scripts/screenshot-notes.py --assets artifacts --notes artifacts/release-notes.md
          python3 scripts/build-info.py --repo "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG"
          flags=(--prerelease=false --latest=true)
          if [[ "$PRERELEASE" == 'true' ]]; then flags=(--prerelease=true --latest=false); fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" "${flags[@]}" --notes-file artifacts/release-notes.md
          else
            gh release create "$RELEASE_TAG" "${flags[@]}" --verify-tag --title "Velunivo ${{ needs.prepare.outputs.version }}" --notes-file artifacts/release-notes.md
          fi
          gh release upload "$RELEASE_TAG" artifacts/Velunivo.ipa artifacts/Velunivo.apk artifacts/Velunivo-simulator.app.zip artifacts/web.zip artifacts/build_info.json --clobber
      - name: Update mutable AltSource release at fixed 1.0 URL
        if: needs.prepare.outputs.prerelease != 'true'
        run: |
          if ! gh release view 1.0 >/dev/null 2>&1; then
            gh release create 1.0 --target "$GITHUB_SHA" --title 'Velunivo AltSource' --notes 'Mutable source feed. Add apps.json to AltStore Classic or SideStore. Binary releases use v-prefixed version tags.' --latest=false
          fi
          mkdir -p work/source
          if gh release view 1.0 --json assets --jq '.assets[].name' | grep -qx apps.json; then
            gh release download 1.0 --pattern apps.json --dir work/source
          fi
          python3 scripts/update-source.py --repo "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG" --existing work/source/apps.json --output work/source/apps.json
          python3 scripts/publish-source.py --repo "$GITHUB_REPOSITORY" --source work/source
