name: Refresh native AltSource gallery
on:
  workflow_run:
    workflows: ['Build and release']
    types: [completed]
  workflow_dispatch:
    inputs:
      build_run:
        description: 'Published build run containing ios-simulator (no compilation)'
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: altsource-gallery
  cancel-in-progress: true
jobs:
  identify:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.run.outputs.run }}
      ready: ${{ steps.run.outputs.ready }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - id: run
        env:
          BUILD_RUN: ${{ inputs.build_run || github.event.workflow_run.id }}
        run: |
          [[ "$BUILD_RUN" =~ ^[0-9]+$ ]] || exit 1
          echo "run=$BUILD_RUN" >> "$GITHUB_OUTPUT"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN/jobs?per_page=100" > jobs.json
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, sys
          jobs=json.load(open('jobs.json'))['jobs']
          published=any(j['name']=='publish' and j['conclusion']=='success' for j in jobs)
          print('ready='+str(published).lower())
          if not published: print('::notice::No successful binary publication; gallery refresh skipped.',file=sys.stderr)
          PY
  capture:
    needs: identify
    if: needs.identify.outputs.ready == 'true'
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      BUILD_RUN: ${{ needs.identify.outputs.run }}
    steps:
      - uses: actions/checkout@v4
      - name: Select installed verification tools without downloading runtimes
        run: |
          python3 - <<'PY' >> "$GITHUB_ENV"
          from pathlib import Path
          import re, subprocess
          choices=[p for p in Path('/Applications').glob('Xcode*.app') if 'beta' in p.name.lower() and not p.is_symlink()]
          developer=str(max(choices,key=lambda p:tuple(map(int,re.findall(r'\d+',p.name))))/'Contents/Developer') if choices else subprocess.check_output(['xcode-select','-p'],text=True).strip()
          print('DEVELOPER_DIR='+developer)
          PY
      - name: Download the already compiled Simulator app
        run: |
          mkdir -p artifacts
          gh run download "$BUILD_RUN" --repo "$GITHUB_REPOSITORY" --name ios-simulator --dir artifacts
          ditto -x -k artifacts/Velunivo-simulator.app.zip artifacts
          sudo mdutil -a -i off || true
      - name: Capture iPhone then landscape iPad; preserve old screenshots on failure
        timeout-minutes: 24
        run: |
          for family in iphone ipad; do
            if ! python3 scripts/simulator-screenshots.py --family "$family" --gallery; then
              echo "::warning::$family fresh capture failed twice; retaining the published gallery."
              python3 scripts/screenshot-fallback.py --repo "$GITHUB_REPOSITORY" --family "$family"
            fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gallery-native
          path: |
            artifacts/iphone*.png
            artifacts/ipad*.png
            artifacts/*-screenshot.json
            artifacts/*-*.log
            artifacts/*.ips
  publish:
    needs: [identify, capture]
    runs-on: ubuntu-latest
    concurrency:
      group: altsource
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: gallery-*
          path: artifacts
          merge-multiple: true
      - name: Check both fresh galleries against the latest published binary
        id: gallery
        run: |
          mkdir -p work/source
          gh release download 1.0 --repo "$GITHUB_REPOSITORY" --pattern apps.json --dir work/source
          python3 scripts/gallery-ready.py --assets artifacts --source work/source/apps.json >> "$GITHUB_OUTPUT"
      - name: Publish screenshots to AltSource only (iPhone before landscape iPad)
        if: steps.gallery.outputs.ready == 'true'
        env:
          RELEASE_TAG: ${{ steps.gallery.outputs.tag }}
        run: |
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern build_info.json --dir artifacts
          python3 scripts/update-source.py --repo "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG" --assets artifacts --existing work/source/apps.json --output work/source/apps.json
          python3 scripts/publish-source.py --repo "$GITHUB_REPOSITORY" --source work/source
