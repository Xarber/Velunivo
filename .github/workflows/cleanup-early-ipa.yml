name: Remove temporary unsigned IPA artifact
on:
  workflow_run:
    workflows: ['Build and release']
    types: [completed]
permissions:
  actions: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete only the completed run's early IPA copy
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const run_id = context.payload.workflow_run.id;
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              owner, repo, run_id, per_page: 100
            });
            for (const artifact of artifacts) {
              if (artifact.name !== 'ios-unsigned-early') continue;
              await github.rest.actions.deleteArtifact({ owner, repo, artifact_id: artifact.id });
              core.info(`Deleted temporary IPA artifact ${artifact.id} from run ${run_id}`);
            }
