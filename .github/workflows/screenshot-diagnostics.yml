name: Simulator screenshot diagnostics
on:
  workflow_dispatch:
    inputs:
      source_run:
        description: 'Completed build run containing the ios artifact (no compilation)'
        required: true
        default: '38207740453'
      source_artifact:
        description: 'Use ios for older runs; ios-simulator for parallel builds'
        required: true
        default: 'ios'
permissions:
  contents: read
  actions: read
concurrency:
  group: screenshot-headless-clone
  cancel-in-progress: true
jobs:
  inspect:
    runs-on: xcode-27
    strategy:
      fail-fast: false
      matrix:
        family: [iphone, ipad]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Select installed Xcode beta
        run: |
          python3 - <<'PYCODE' >> "$GITHUB_ENV"
          from pathlib import Path
          import re
          candidates=[p for p in Path('/Applications').glob('Xcode*.app') if 'beta' in p.name.lower() and not p.is_symlink()]
          chosen=max(candidates,key=lambda p:tuple(map(int,re.findall(r'\d+',p.name))))
          print(f'DEVELOPER_DIR={chosen}/Contents/Developer')
          PYCODE
      - name: Inspect installed Simulator tools and host capacity
        run: |
          ls -la /Applications
          find /Applications /Library/Developer -maxdepth 10 \( -name '*Device*.app' -o -name Simulator.app \) 2>/dev/null || true
          xcrun devicectl help || true
          xcode-select -p
          xcrun simctl help
          xcrun simctl io help || true
          xcrun simctl list devices available
          df -h
          sysctl hw.memsize hw.ncpu
          ps -axo pid,pcpu,pmem,comm | sort -k2 -rn | head -20
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.source_artifact }}
          path: artifacts
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run }}
      - run: ditto -x -k artifacts/Velunivo-simulator.app.zip artifacts
      - name: Capture device without rebuilding
        timeout-minutes: 8
        run: python3 scripts/simulator-screenshots.py --family "${{ matrix.family }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshot-diagnostics-${{ matrix.family }}
          path: |
            artifacts/*.png
            artifacts/*-screenshot.json
            artifacts/*-simulator.log
            artifacts/*-launch.log
            artifacts/*-host.log
