name: Simulator screenshot diagnostics
on:
  workflow_dispatch:
    inputs:
      source_run:
        description: 'Completed build run containing the ios artifact (no compilation)'
        required: true
        default: '38207740453'
      source_artifact:
        description: 'Use ios for older runs; ios-simulator for parallel builds'
        required: true
        default: 'ios'
permissions:
  contents: read
  actions: read
concurrency:
  group: screenshot-stable-comparison
  cancel-in-progress: true
jobs:
  inspect:
    runs-on: macos-26
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Use installed stable tools for comparison
        run: |
          python3 - <<'PYCODE' >> "$GITHUB_ENV"
          from pathlib import Path
          import re
          import subprocess
          print('DEVELOPER_DIR=' + subprocess.check_output(['xcode-select', '-p'], text=True).strip())
          PYCODE
      - name: Inspect installed Simulator tools and host capacity
        run: |
          ls -la /Applications
          find /Applications /Library/Developer -maxdepth 10 \( -name '*Device*.app' -o -name Simulator.app \) 2>/dev/null || true
          xcrun devicectl help || true
          xcode-select -p
          xcrun simctl help
          xcrun simctl io help || true
          xcrun simctl list devices available
          df -h
          sysctl hw.memsize hw.ncpu
          ps -axo pid,pcpu,pmem,comm | sort -k2 -rn | head -20
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.source_artifact }}
          path: artifacts
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run }}
      - run: ditto -x -k artifacts/Velunivo-simulator.app.zip artifacts
      - name: Capture iPad without rebuilding
        timeout-minutes: 8
        run: python3 scripts/simulator-screenshots.py --family ipad
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshot-diagnostics
          path: |
            artifacts/ipad.png
            artifacts/*-screenshot.json
            artifacts/*-simulator.log
            artifacts/*-launch.log
            artifacts/*-host.log
