name: Diagnose Simulator launch
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing binary release
        default: v0.1.0
        required: false
      run_id:
        description: 'Existing Build and release run with an ios artifact (overrides tag)'
        required: false
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: xcode-27
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        family: [iphone, ipad]
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
      BINARY_RUN_ID: ${{ inputs.run_id }}
    steps:
      - uses: actions/checkout@v4
      - name: Select installed beta and fetch existing Simulator build
        run: |
          python3 - <<'PY' >> "$GITHUB_ENV"
          from pathlib import Path
          import re
          # Capture the installed iOS 27.0 runtime with its matching tools.
          chosen=Path('/Applications/Xcode_27.app')
          if not chosen.is_dir(): raise SystemExit('Matching installed Xcode 27 runtime tools are unavailable')
          print(f'DEVELOPER_DIR={chosen}/Contents/Developer')
          PY
          mkdir -p artifacts
          if [[ -n "$BINARY_RUN_ID" ]]; then
            [[ "$BINARY_RUN_ID" =~ ^[0-9]+$ ]] || { echo 'Use a numeric workflow run ID'; exit 1; }
            gh run download "$BINARY_RUN_ID" --repo "$GITHUB_REPOSITORY" --name ios-simulator --dir artifacts || gh run download "$BINARY_RUN_ID" --repo "$GITHUB_REPOSITORY" --name ios --dir artifacts
          else
            gh release download "$RELEASE_TAG" --pattern Velunivo-simulator.app.zip --dir artifacts
          fi
          ditto -x -k artifacts/Velunivo-simulator.app.zip artifacts
      - run: sudo mdutil -a -i off || true
      - run: python3 scripts/simulator-screenshots.py --gallery --family "${{ matrix.family }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-diagnostics-${{ matrix.family }}
          path: |
            artifacts/*.png
            artifacts/*.log
            artifacts/*.ips
            artifacts/*.json
