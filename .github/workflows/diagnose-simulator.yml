name: Diagnose Simulator launch
on:
  workflow_dispatch:
    inputs:
      runner:
        description: Installed runtime architecture (must match downloaded app)
        type: choice
        options: [xcode-27, macos-26, macos-26-intel]
        default: xcode-27
      tag:
        description: Existing binary release
        default: v0.1.0
        required: false
      run_id:
        description: 'Existing Build and release run with an ios artifact (overrides tag)'
        required: false
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: ${{ inputs.runner || 'xcode-27' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        family: [iphone, ipad]
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
      BINARY_RUN_ID: ${{ inputs.run_id }}
      VELUNIVO_CAPTURE_HEADLESS: '1'
      VELUNIVO_CAPTURE_MIN_IOS: ${{ inputs.runner == 'xcode-27' && '27' || '0' }}
      VELUNIVO_CAPTURE_IPHONE_NAME: ${{ inputs.runner == 'xcode-27' && 'iPhone 17 Pro' || '' }}
      VELUNIVO_CAPTURE_BOOT_TIMEOUT: '120'
    steps:
      - uses: actions/checkout@v4
      - name: Select installed capture tools and fetch existing Simulator build
        run: |
          python3 - <<'PY' >> "$GITHUB_ENV"
          from pathlib import Path
          import re
          import subprocess
          candidates=[p for p in Path('/Applications').glob('Xcode*.app') if 'beta' in p.name.lower() and not p.is_symlink()]
          chosen=max(candidates,key=lambda p:tuple(map(int,re.findall(r'\d+',p.name)))) if candidates else None
          print('DEVELOPER_DIR='+str(chosen/'Contents/Developer') if chosen else 'DEVELOPER_DIR='+subprocess.check_output(['xcode-select','-p'],text=True).strip())
          PY
          mkdir -p artifacts
          if [[ -n "$BINARY_RUN_ID" ]]; then
            [[ "$BINARY_RUN_ID" =~ ^[0-9]+$ ]] || { echo 'Use a numeric workflow run ID'; exit 1; }
            gh run download "$BINARY_RUN_ID" --repo "$GITHUB_REPOSITORY" --name ios-simulator --dir artifacts || gh run download "$BINARY_RUN_ID" --repo "$GITHUB_REPOSITORY" --name ios --dir artifacts || gh run download "$BINARY_RUN_ID" --repo "$GITHUB_REPOSITORY" --name gallery-intel-app --dir artifacts
          else
            gh release download "$RELEASE_TAG" --pattern Velunivo-simulator.app.zip --dir artifacts
          fi
          ditto -x -k artifacts/Velunivo-simulator.app.zip artifacts
      - name: Stop prebooted hosted devices before the owned capture
        run: |
          python3 - <<'PY'
          import subprocess
          print(subprocess.check_output(['xcrun','simctl','list','devices','booted','--json'],text=True))
          subprocess.run(['xcrun','simctl','shutdown','all'],timeout=60,check=False)
          PY
      - run: sudo mdutil -a -i off || true
      - run: python3 scripts/simulator-screenshots.py --gallery --family "${{ matrix.family }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-diagnostics-${{ matrix.family }}
          path: |
            artifacts/*.png
            artifacts/*.log
            artifacts/*.ips
            artifacts/*.json
