name: Diagnose Simulator launch
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing binary release
        default: v0.1.0
        required: false
      run_id:
        description: 'Existing Build and release run with an ios artifact (overrides tag)'
        required: false
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        family: [iphone, ipad]
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
      BINARY_RUN_ID: ${{ inputs.run_id }}
      VELUNIVO_CAPTURE_HEADLESS: '1'
      VELUNIVO_CAPTURE_BOOT_TIMEOUT: '120'
    steps:
      - uses: actions/checkout@v4
      - name: Select installed beta and fetch existing Simulator build
        run: |
          python3 - <<'PY' >> "$GITHUB_ENV"
          from pathlib import Path
          import re
          import subprocess
          print('DEVELOPER_DIR='+subprocess.check_output(['xcode-select','-p'],text=True).strip())
          PY
          mkdir -p artifacts
          if [[ -n "$BINARY_RUN_ID" ]]; then
            [[ "$BINARY_RUN_ID" =~ ^[0-9]+$ ]] || { echo 'Use a numeric workflow run ID'; exit 1; }
            gh run download "$BINARY_RUN_ID" --repo "$GITHUB_REPOSITORY" --name ios-simulator --dir artifacts || gh run download "$BINARY_RUN_ID" --repo "$GITHUB_REPOSITORY" --name ios --dir artifacts
          else
            gh release download "$RELEASE_TAG" --pattern Velunivo-simulator.app.zip --dir artifacts
          fi
          ditto -x -k artifacts/Velunivo-simulator.app.zip artifacts
      - name: Stop prebooted hosted devices before the owned capture
        run: |
          python3 - <<'PY'
          import subprocess
          print(subprocess.check_output(['xcrun','simctl','list','devices','booted','--json'],text=True))
          subprocess.run(['xcrun','simctl','shutdown','all'],timeout=60,check=False)
          PY
      - run: sudo mdutil -a -i off || true
      - run: python3 scripts/simulator-screenshots.py --gallery --family "${{ matrix.family }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-diagnostics-${{ matrix.family }}
          path: |
            artifacts/*.png
            artifacts/*.log
            artifacts/*.ips
            artifacts/*.json
