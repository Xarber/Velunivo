name: Capture native Android onboarding
on:
  workflow_dispatch:
    inputs:
      build_run:
        description: Existing build run containing the Android APK (no compilation)
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: android-onboarding-capture
  cancel-in-progress: true
jobs:
  capture:
    strategy:
      fail-fast: false
      matrix:
        include:
          - family: phone
            profile: pixel_11_pro
            size: 1280x2856
            density: 480
          - family: tablet
            profile: 10.1in WXGA (Tablet)
            size: 2560x1600
            density: 320
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      BUILD_RUN: ${{ inputs.build_run }}
      CAPTURE_FAMILY: ${{ matrix.family }}
      CAPTURE_SIZE: ${{ matrix.size }}
      CAPTURE_DENSITY: ${{ matrix.density }}
      CAPTURE_PROFILE: ${{ matrix.profile }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Download existing APK; never compile for a screenshot
        run: |
          [[ "$BUILD_RUN" =~ ^[0-9]+$ ]] || exit 1
          mkdir -p artifacts
          gh run download "$BUILD_RUN" --repo "$GITHUB_REPOSITORY" --name android --dir artifacts
      - name: Enable hosted emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 37
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.profile }}
          ram-size: 4096M
          heap-size: 512M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none
          script: python3 scripts/android-screenshots.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: onboarding-native-android-${{ matrix.family }}
          path: |
            artifacts/android-*.png
            artifacts/android-*.json
            artifacts/android-*.xml
            artifacts/android-*.log
