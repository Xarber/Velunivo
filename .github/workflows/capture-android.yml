name: Capture native Android onboarding
on:
  workflow_dispatch:
    inputs:
      build_run:
        description: Existing build run containing the Android APK (no compilation)
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: android-onboarding-capture
  cancel-in-progress: true
jobs:
  identify:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.run.outputs.run }}
      ready: ${{ steps.run.outputs.ready }}
    steps:
      - id: run
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN: ${{ inputs.build_run || github.event.workflow_run.id }}
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          [[ "$BUILD_RUN" =~ ^[0-9]+$ ]] || exit 1
          echo "run=$BUILD_RUN" >> "$GITHUB_OUTPUT"
          if [[ "$MANUAL" == 'true' ]]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN/jobs?per_page=100" --jq 'any(.jobs[]; .name == "publish" and .conclusion == "success")' | sed 's/^/ready=/' >> "$GITHUB_OUTPUT"
          fi
  capture:
    needs: identify
    if: needs.identify.outputs.ready == 'true' 
    strategy:
      fail-fast: false
      matrix:
        include:
          - family: phone
            profile: pixel_11_pro
            size: 1280x2856
            density: 480
          - family: tablet
            profile: 10.1in WXGA (Tablet)
            size: 2560x1600
            density: 320
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANDROID_USER_HOME: ${{ github.workspace }}/.android-capture
      GH_TOKEN: ${{ github.token }}
      BUILD_RUN: ${{ needs.identify.outputs.run }}
      CAPTURE_FAMILY: ${{ matrix.family }}
      CAPTURE_SIZE: ${{ matrix.size }}
      CAPTURE_DENSITY: ${{ matrix.density }}
      CAPTURE_PROFILE: ${{ matrix.profile }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Refresh current hardware profiles and SDK package schema
        run: |
          sdkmanager --install 'cmdline-tools;23.0'
          echo "$ANDROID_HOME/cmdline-tools/23.0/bin" >> "$GITHUB_PATH"
      - name: Inventory requested runtime and hardware before boot
        run: |
          mkdir -p artifacts
          sdkmanager --list > artifacts/android-sdk-packages.log
          # SDK hardware lists lag behind phone releases. Install our documented
          # display-only Pixel 11 Pro profile rather than relabel an older Pixel.
          mkdir -p "$ANDROID_USER_HOME" "$HOME/.android"
          cp scripts/pixel-11-pro-device.xml "$ANDROID_USER_HOME/devices.xml"
          cp scripts/pixel-11-pro-device.xml "$HOME/.android/devices.xml"
          avdmanager list device > artifacts/android-device-profiles.log
          if ! grep -Eq 'system-images[/;]android-37[.]0[/;]google_apis[/;]x86_64' artifacts/android-sdk-packages.log; then
            echo '::error::The configured Android SDK repository does not supply the Android 17 emulator image. Refusing an older runtime with a new label.'
            exit 1
          fi
          if ! grep -Fq '"${{ matrix.profile }}"' artifacts/android-device-profiles.log; then
            echo '::error::The requested hardware profile is not installed. See the captured SDK inventory.'
            exit 1
          fi
      - name: Download existing APK; never compile for a screenshot
        run: |
          [[ "$BUILD_RUN" =~ ^[0-9]+$ ]] || exit 1
          mkdir -p artifacts
          gh run download "$BUILD_RUN" --repo "$GITHUB_REPOSITORY" --name android --dir artifacts
      - name: Verify existing APK identity before starting Android
        run: |
          "$ANDROID_HOME/build-tools/37.0.0/aapt2" dump badging artifacts/Velunivo.apk > artifacts/android-apk.log
          head -1 artifacts/android-apk.log
      - name: Enable hosted emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: '37.0'
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.profile }}
          ram-size: 4096M
          heap-size: 512M
          disk-size: 8192M
          disable-animations: true
          emulator-options: -no-window -gpu software -noaudio -no-boot-anim -no-snapshot -camera-back none
          script: python3 scripts/android-screenshots.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: onboarding-native-android-${{ matrix.family }}
          path: |
            artifacts/android-*.png
            artifacts/android-*.json
            artifacts/android-*.xml
            artifacts/android-*.log

  publish:
    needs: capture
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    concurrency:
      group: android-gallery-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          pattern: onboarding-native-android-*
          path: artifacts
          merge-multiple: true
      - name: Validate both native galleries before staging distribution metadata
        run: python3 scripts/stage-android-screenshots.py artifacts > artifacts/android-gallery.json
      - uses: actions/upload-artifact@v4
        with:
          name: android-distribution-screenshots
          path: |
            fastlane/metadata/android/*/images/phoneScreenshots
            fastlane/metadata/android/*/images/tenInchScreenshots
            artifacts/android-gallery.json
      - name: Refresh repository metadata only for its current app version
        run: |
          VERSION=$(python3 -c "import json;print(json.load(open('artifacts/android-capture.json'))['appVersion'])")
          CURRENT=$(python3 -c "import json;print(json.load(open('package.json'))['version'])")
          if [[ "$VERSION" != "$CURRENT" ]]; then
            echo '::notice::Historical build captured; metadata artifact retained without replacing current previews.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fastlane/metadata/android assets/onboarding/android-*.png assets/onboarding/provenance.json
          if git diff --cached --quiet; then exit 0; fi
          git -c commit.gpgsign=false commit --no-gpg-sign -m "docs: Refresh Android native previews for $VERSION"
          git push origin HEAD:main
